<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Formulários</h1>
    <form autocomplete="off" method="get" autocomplete="on">
            <p>
                <label for="inome">Nome:</label>

                <input type="text" name="nome" id="inome" autocomplete="on" minlength="3" maxlength="7" placeholder="Nome do usuário" size="10">
            </p>

        <p>
            <label for="isobrenome">Sobrenome:</label>

            <input type="text" name="sobrenome" id="isobrenome" autocomplete="on" minlength="3" maxlength="7" placeholder="Sobrenome do usuário" size="12">
        </p>

        <input type="submit">
        <input type="reset">

        <p>
            <label for="isenha">Senha</label>

            <input type="password" name="senha" id="isenha" autocomplete="current-password">
        </p>

        <p>
            <label for="imedia">Media</label>

            <input type="number" name="media" id="imedia" min="0" max="10" step="0.5" placeholder="0 a 10" value="5" required>
        </p>

        <p>
            <label for="imes">Periodo Letivo</label>

            <input type="month" name="mes" id="imes" value="2020-07">
        </p>

        <p>
            <label for="idata">Data</label>

            <input type="date" name="data" id="idata">
        </p>

        <p>
            <label for="ihora"></label>

            <input type="time" name="hora" id="ihora">
        </p>
    </form>
</body>
</html>
