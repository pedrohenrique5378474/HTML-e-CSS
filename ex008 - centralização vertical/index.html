<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caixa vertical</title>
    <style>
        #container {
            height: 96vh;
            background-color: blueviolet;
            background-image: url(image/alvo.jpg);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            position: relative;
        }

        #conteudo {
            background-color: yellow;
            background-size: 100% 100%;
            height: 200px;
            width: 300px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-46%, -56%);
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="conteudo">

        </div>
    </div>
</body>
</html>
