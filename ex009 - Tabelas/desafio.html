<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        th {
            background-color: grey;
            color: white;
            border: 1px solid black;
            width: 100px;
            padding: 10px;
        }

        .titulo_padrao {
            background-color: white;
            color: black;
        }

        td {
            border: 1px solid black;
            width: 100px;
            padding: 10px;
        }
    </style>
</head>
<body>
        <table>
            <thead>
                <tr>
                    <th colspan="2" rowspan="2" scope="colgroup">Área</th>
                    <th colspan="2" rowspan="2" scope="col">Disciplina</th>
                    <th colspan="2" scope="colgroup">Notas</th>
                    <th colspan="2" rowspan="2" scope="col">Média</th>
                </tr>

                <tr>
                    <th scope="col">Nota 1</th>
                    <th scope="col">Nota 2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th rowspan="4" scope="rowgroup" class="titulo_padrao">Exatas</th>
                    <td>Mátematica</td>
                    <td colspan="2">0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>Fisica</td>
                    <td colspan="2">0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>Quimica</td>
                    <td>0.0</td>
                    <td colspan="2">0.0</td>
                    <td>0,0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>Biologia</td>
                    <td>0.0</td>
                    <td colspan="2">0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <th colspan="6" scope="row">Média de Exatas</th>
                    <th>0.0</th>
                </tr>
                <tr>
                    <th rowspan="2" scope="rowgroup" class="titulo_padrao">Humanas</th>
                    <td>História</td>
                    <td>0.0</td>
                    <td colspan="2">0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>Geografia</td>
                    <td>0.0</td>
                    <td colspan="2">0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <th colspan="6" scope="row">Média de Humanas</th>
                    <th>0.0</th>
                </tr>
            </tbody>
        </table>
</body>
</html>
